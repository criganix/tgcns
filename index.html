<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS Messages</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #000000;
            color: #ffffff;
            height: 100%;
            width: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* HEADER iOS - Spațiere ajustată pentru a fi sub bara Telegram */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: calc(env(safe-area-inset-top) + 52px); /* Spatiu generos pentru a evita suprapunerea */
            padding-bottom: 12px;
            background-color: #000000;
            border-bottom: 0.5px solid #1c1c1e;
            position: relative;
            z-index: 10;
        }

        .avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(180deg, #8e8e93 0%, #636366 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
        }

        .avatar svg {
            width: 38px;
            height: 38px;
            fill: #ffffff;
        }

        .sender-name {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 3px;
            letter-spacing: -0.2px;
        }

        .sender-name svg {
            width: 11px;
            height: 11px;
            fill: #8e8e93;
        }

        /* ZONA DE CHAT */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .timestamp-divider {
            text-align: center;
            color: #8e8e93;
            font-size: 12px;
            font-weight: 500;
            margin: 12px 0;
            line-height: 1.4;
            letter-spacing: -0.1px;
        }

        /* BULE DE MESAJ iOS REALISTE */
        .message-row {
            display: flex;
            flex-direction: column;
            width: 100%;
            opacity: 0;
            transform: translateY(12px) scale(0.96);
            animation: iosPop 0.22s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        @keyframes iosPop {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message-row.sent {
            align-items: flex-end;
        }

        .message-row.received {
            align-items: flex-start;
        }

        .bubble {
            max-width: 78%;
            padding: 10px 16px;
            font-size: 17px;
            line-height: 1.32;
            white-space: pre-wrap;
            word-wrap: break-word;
            letter-spacing: -0.4px;
        }

        .sent .bubble {
            background-color: #34c759;
            color: #ffffff;
            border-radius: 20px 20px 5px 20px;
        }

        .received .bubble {
            background-color: #26252a;
            color: #ffffff;
            border-radius: 20px 20px 20px 5px;
        }

        /* INPUT BAR iOS 1:1 */
        .input-bar {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            padding-bottom: calc(env(safe-area-inset-bottom) + 10px);
            background-color: #000000;
            gap: 10px;
        }

        .add-btn {
            background: #1c1c1e;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8e8e93;
            font-size: 22px;
            font-weight: 300;
            cursor: pointer;
            flex-shrink: 0;
        }

        .input-wrapper {
            flex: 1;
            background-color: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 22px;
            display: flex;
            align-items: center;
            padding: 6px 10px 6px 14px;
            min-height: 40px;
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 17px;
            outline: none;
            letter-spacing: -0.3px;
        }

        .input-wrapper input::placeholder {
            color: #8e8e93;
        }

        .send-btn {
            background: #34c759;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.1s ease;
        }

        .send-btn:active {
            transform: scale(0.9);
        }

        .send-btn svg {
            width: 16px;
            height: 16px;
            fill: #ffffff;
        }

        .mic-btn {
            background: none;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 2px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- Header iOS corectat ca poziție și dimensiune -->
    <div class="header">
        <div class="avatar">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <div class="sender-name">
            7000
            <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </div>
    </div>

    <!-- Zona Chat -->
    <div class="chat-container" id="chat">
        <div class="timestamp-divider">
            Mesaj text • SMS<br><span id="current-date"></span>
        </div>
    </div>

    <!-- Bara de introducere mesaj -->
    <div class="input-bar">
        <button class="add-btn">+</button>
        <div class="input-wrapper">
            <input type="text" id="boardInput" placeholder="Mesaj text • SMS" autocomplete="off">
            
            <button class="mic-btn" id="micBtn">
                <svg width="17" height="20" viewBox="0 0 24 24" fill="#8e8e93"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </button>

            <button class="send-btn" id="sendBtn" onclick="sendSMS()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        if (tg) {
            tg.ready();
            if (tg.expand) tg.expand();
            if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
        }

        function formatIOSDate() {
            const days = ['Dum.', 'Lun.', 'Mar.', 'Mie.', 'Joi', 'Vin.', 'Sâm.'];
            const months = ['ian.', 'feb.', 'mar.', 'apr.', 'mai', 'iun.', 'iul.', 'aug.', 'sep.', 'oct.', 'noi.', 'dec.'];
            const now = new Date();
            return `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}, ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        }
        document.getElementById('current-date').innerText = formatIOSDate();

        const inputField = document.getElementById('boardInput');
        const chat = document.getElementById('chat');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');

        inputField.addEventListener('input', function () {
            if (this.value.trim().length > 0) {
                sendBtn.style.display = 'flex';
                micBtn.style.display = 'none';
            } else {
                sendBtn.style.display = 'none';
                micBtn.style.display = 'flex';
            }
        });

        inputField.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendSMS();
            }
        });

        function sendSMS() {
            const text = inputField.value.trim();
            if (text.length === 0) return;

            appendMessage(text, 'sent');
            inputField.value = '';
            sendBtn.style.display = 'none';
            micBtn.style.display = 'flex';

            setTimeout(() => {
                appendMessage("Solicitarea este in curs de procesare.", 'received');

                setTimeout(() => {
                    generateTicket(text);
                }, 1200);
            }, 500);
        }

        function appendMessage(text, type) {
            const row = document.createElement('div');
            row.className = `message-row ${type}`;
            row.innerHTML = `<div class="bubble">${text}</div>`;
            chat.appendChild(row);
            chat.scrollTop = chat.scrollHeight;
        }

        function generateTicket(boardNr) {
            let lastCounter = localStorage.getItem('contor_' + boardNr) || Math.floor(1000 + Math.random() * 8900);
            lastCounter = parseInt(lastCounter) + 1;
            if (lastCounter > 9999) lastCounter = 1000;
            localStorage.setItem('contor_' + boardNr, lastCounter);

            const biletNr = `${boardNr}${lastCounter.toString().padStart(4, '0')}`;

            const now = new Date();
            const dateStr = `${now.getDate().toString().padStart(2, '0')}.${(now.getMonth()+1).toString().padStart(2, '0')}.${now.getFullYear()}`;
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            const biletText = `Bilet electronic nr. \n ${biletNr} \n Data ${dateStr} ora ${timeStr} \n Valabil 1 ora \n Pret 7 MDL \n Numar de bord ${boardNr}`;

            appendMessage(biletText, 'received');
        }
    </script>
</body>
</html>
